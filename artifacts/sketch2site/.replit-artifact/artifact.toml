kind = "web"
previewPath = "/"
title = "Sketch2Site"
description = "An AI-assisted visual website builder where creators sketch layouts on a Paint-inspired canvas, convert them into responsive websites, edit the result, inspect generated code, and export the project."
version = "1.0.0"
id = "artifacts/sketch2site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20295

[services.development]
run = "pnpm --filter @workspace/sketch2site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sketch2site", "run", "build" ]
serve = "static"
publicDir = "artifacts/sketch2site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20295"
BASE_PATH = "/"
